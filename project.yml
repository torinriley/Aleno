name: Aleno
options:
  bundleIdPrefix: com.aleno
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CLANG_ENABLE_MODULES: YES
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  Aleno:
    type: application
    platform: macOS
    configFiles:
      Debug: config/Signing.xcconfig
      Release: config/Signing.xcconfig
    dependencies:
      - package: Sparkle
    sources:
      - path: app
        excludes: ["Resources/Info.plist", "Application/aleno.h", "Resources/Fonts", "Resources/AppIcon.icon"]
      - path: shaders
      - path: app/Resources/Fonts
        type: folder
        buildPhase: resources
      # Icon Composer document: one file reference (not a folder of files); compiled into the app icon by actool.
      - path: app/Resources/AppIcon.icon
        type: file
        buildPhase: resources
      - path: app/Application/aleno.h
        buildPhase: none
    info:
      path: app/Resources/Info.plist
      properties:
        CFBundleName: Aleno
        CFBundleDisplayName: Aleno
        CFBundleShortVersionString: "0.1.7"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # Sparkle auto-update. The feed is the appcast.xml that release.yml attaches to every GitHub release;
        # SUPublicEDKey is the public half of the key whose private half signs the updates (see docs/RELEASING.md).
        SUFeedURL: https://github.com/torinriley/Aleno/releases/latest/download/appcast.xml
        SUPublicEDKey: "f2rjBhPysEY4iVueLusISw9MQNzee4zRtuoSqH0+ZJQ="
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false     # ask first: Sparkle shows its update prompt instead of installing silently
        SUScheduledCheckInterval: 3600   # while Aleno stays open, check hourly (Sparkle's minimum); Updater.swift also checks at launch
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDocumentTypes:
          - CFBundleTypeName: Folder
            CFBundleTypeRole: Viewer
            LSItemContentTypes: ["public.folder"]
            LSHandlerRank: Alternate
        NSServices:
          - NSMenuItem: { default: "New Aleno Window Here" }
            NSMessage: openWindowHere
            NSPortName: Aleno
            NSSendTypes: ["NSFilenamesPboardType", "public.plain-text"]
            NSRequiredContext: { NSTextContent: FilePath }
          - NSMenuItem: { default: "New Aleno Tab Here" }
            NSMessage: openTabHere
            NSPortName: Aleno
            NSSendTypes: ["NSFilenamesPboardType", "public.plain-text"]
            NSRequiredContext: { NSTextContent: FilePath }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleno.Aleno
        PRODUCT_NAME: Aleno
        SWIFT_OBJC_BRIDGING_HEADER: app/Application/aleno.h
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/target/release"]
        OTHER_LDFLAGS: ["-laleno_client"]
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Build Rust (aleno-client, aleno-daemon)
        script: '"$PROJECT_DIR/scripts/build-rust.sh"'
        inputFiles: []
        outputFiles:
          - $(PROJECT_DIR)/target/release/libaleno_client.a
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: Embed daemon and schema
        script: '"$PROJECT_DIR/scripts/embed.sh"'
        basedOnDependencyAnalysis: false
