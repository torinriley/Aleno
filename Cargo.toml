[workspace]
resolver = "2"
members = ["crates/aleno-terminal", "crates/aleno-protocol", "crates/aleno-session", "crates/aleno-daemon", "crates/aleno-client"]

[workspace.package]
version = "0.1.6"

[workspace.dependencies]
vte = "0.15"
unicode-width = "0.2"
libc = "0.2"
serde_json = "1"

[patch.crates-io]
# vte with a one-line `is_ground()` accessor (see vendor/vte/src/lib.rs, marked "Aleno patch").
vte = { path = "vendor/vte" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
debug = 1

[profile.dev]
opt-level = 2
